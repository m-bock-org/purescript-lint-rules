package:
  name: lint-purs-rules
  description: A set of general-purpose lint rules for the lint-purs engine.
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-bock
      githubRepo: purescript-lint-rules
  dependencies:
    - arrays
    - const
    - foldable-traversable
    - language-cst-parser
    - lint-purs
    - maybe
    - newtype
    - ordered-collections
    - prelude
    - strings
    - transformers
    - tuples
  test:
    main: Test.Lint
    dependencies:
      - aff
      - effect
      - node-process
workspace:
  packageSet:
    registry: 66.9.0
  extraPackages:
    lint-purs:
      git: https://github.com/m-bock/purescript-lint.git
      ref: b04cae65650a89e1972f20dce3a5f8f59c5c73c0
      dependencies:
        - aff
        - arrays
        - console
        - effect
        - either
        - encode-decode
        - foldable-traversable
        - foreign-object
        - language-cst-parser
        - maybe
        - node-buffer
        - node-child-process
        - node-fs
        - node-glob-basic
        - node-path
        - ordered-collections
        - prelude
        - strings
        - transformers
        - tuples
    encode-decode:
      git: https://github.com/m-bock/purescript-encode-decode.git
      ref: 07a361b0e42314ee6521b8ccc774eca117be57d0
      dependencies:
        - argonaut-core
        - argonaut-codecs
        - arrays
        - contravariant
        - either
        - foldable-traversable
        - foreign-object
        - heterogeneous
        - maybe
        - ordered-collections
        - prelude
        - record
        - transformers
        - tuples
        - typelevel-prelude
