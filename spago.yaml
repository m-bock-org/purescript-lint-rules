package:
  name: lint-purs-rules
  description: A set of general-purpose lint rules for the lint-purs engine.
  publish:
    version: 0.1.0
    license: MIT
    location:
      githubOwner: m-bock
      githubRepo: purescript-lint-rules
  dependencies:
    - arrays
    - foldable-traversable
    - language-cst-parser
    - lint-purs
    - maybe
    - ordered-collections
    - prelude
    - strings
    - transformers
    - tuples
  test:
    main: Test.Lint
    dependencies:
      - aff
      - console
      - effect
      - node-buffer
      - node-fs
      - node-process
      - strings
